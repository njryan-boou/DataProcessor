[project]
name = "dataflow-backend"
version = "0.1.0"
description = "CSV inspection and processing API for DataFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
